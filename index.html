<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI社員ビルダー v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>[hidden]{display:none!important}

/* Layout: fixed 56px header, then one of three views (管理画面 / 新規作成 / フロー編集). Single light visual world from the MDB (JMAR) design system. */
:root{
  --mdb-navy:#12439B; --mdb-blue:#2060B9; --mdb-cyan:#00A5E5; --mdb-gold:#B08E02; --mdb-orange:#E78801; --mdb-red:#C70909;
  --mdb-ink:#333333; --mdb-muted:#666666; --mdb-faint:#999999; --mdb-white:#FFFFFF;
  --mdb-ice:#F2F9FC; --mdb-canvas:#F8F8F8; --mdb-pale:#C8D9F2; --mdb-edge:#8A9BB5;
  --mdb-rule:#CCCCCC; --mdb-rule-soft:#EEEEEE; --mdb-rule-mid:#DDDDDD;
  --shadow-card:0 0 30px rgba(28,36,56,.15); --shadow-soft:0 0 30px rgba(28,36,56,.08); --shadow-chip:0 0 12px rgba(28,36,56,.12);
  --font-sans:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--mdb-white);color:var(--mdb-ink);font-family:var(--font-sans);font-size:16px;line-height:1.75;overflow:hidden}
*{box-sizing:border-box}
a{color:var(--mdb-cyan)} a:hover{opacity:.5}
input,textarea,select,button{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mdb-cyan);outline-offset:2px}
#root{height:100%}
.h5{opacity:1} .h5:hover{opacity:.5}
.h6:hover{opacity:.6}
.h7:hover{opacity:.7}
.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);background:var(--mdb-white)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;border-bottom:1px solid var(--mdb-rule);min-width:0}
.hdr-l{display:flex;align-items:center;gap:14px;min-width:0}
.hdr-r{display:flex;align-items:center;gap:12px}
.brand{background:none;border:0;padding:0;font-size:18px;font-weight:700;color:var(--mdb-navy);white-space:nowrap}
.vsep{width:1px;height:20px;background:var(--mdb-rule);flex:none}
.crumb{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb .sl{color:var(--mdb-faint);padding:0 8px}
.link{background:none;border:0;padding:0;color:var(--mdb-cyan);font-size:13px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:44px;white-space:nowrap;font-size:13px}
.pill-p{background:var(--mdb-navy);color:#fff;border:0;font-weight:700}
.pill-o{background:#fff;color:var(--mdb-blue);border:1px solid var(--mdb-blue)}
.sq{border-radius:0}
.tag{font-size:11px;color:var(--mdb-cyan);border:1px solid var(--mdb-cyan);padding:1px 6px;line-height:1.5;white-space:nowrap}
.scroll-ice{overflow:auto;background:var(--mdb-ice)}
.page{margin:0 auto;padding:48px 24px 60px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:13px;color:var(--mdb-cyan);font-weight:700}
.h1{margin:0;font-size:26px;font-weight:700;line-height:1.5}
.card{background:#fff;box-shadow:var(--shadow-soft)}
.row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--mdb-rule-soft)}
.ibtn{width:36px;height:36px;border:1px solid var(--mdb-rule);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.fld input,.fld textarea,.fld select{padding:8px 10px;border:1px solid var(--mdb-rule);border-radius:0;font-size:14px;font-weight:400;background:#fff;line-height:1.6}
.fld textarea{resize:vertical}
.btn-danger{background:var(--mdb-red);color:#fff;border:0;padding:8px 16px;font-size:13px;font-weight:700}
.btn-plain{background:#fff;color:var(--mdb-ink);border:1px solid var(--mdb-rule);padding:7px 16px;font-size:13px}
.btn-dangerline{align-self:flex-start;background:none;border:1px solid var(--mdb-red);color:var(--mdb-red);padding:7px 16px;font-size:13px}
/* builder */
.builder{display:grid;grid-template-columns:248px minmax(0,1fr) 320px;min-height:0}
.lside{border-right:1px solid var(--mdb-rule);overflow:auto;display:flex;flex-direction:column;min-height:0}
.lsec{padding:20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--mdb-rule-soft)}
.palette-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;box-shadow:var(--shadow-chip);cursor:grab;font-size:14px}
.canvas{position:relative;overflow:hidden;background-color:var(--mdb-canvas);touch-action:none;min-height:0}
.node{position:absolute;width:200px;height:104px;background:#fff;box-shadow:var(--shadow-card);outline-offset:2px;cursor:grab;user-select:none;-webkit-user-select:none}
.node .bar{height:4px}
.node .body{padding:9px 14px;display:flex;flex-direction:column;gap:5px}
.node .t{font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .s{font-size:12px;color:var(--mdb-muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.port{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--mdb-navy);cursor:crosshair;touch-action:none}
.port:hover{background:var(--mdb-cyan);border-color:var(--mdb-cyan)}
.p-top{left:93px;top:-7px}.p-bottom{left:93px;bottom:-7px;background:var(--mdb-navy)}.p-left{left:-7px;top:45px}.p-right{right:-7px;top:45px}
.port.side{opacity:0;transition:opacity .15s}
.node:hover .port.side,.node.is-sel .port.side,.port.side.used,.connecting .port.side{opacity:1}
@media (hover:none){.port.side{opacity:1}}
.chip-map{display:inline-block;font-size:11px;font-weight:400;color:var(--mdb-blue);background:#EEF3F9;padding:0 6px;line-height:1.7;margin-left:6px;white-space:nowrap}
.help{font-size:12px;font-weight:400;color:var(--mdb-muted);line-height:1.6}
.notebox{font-size:12px;line-height:1.7;color:var(--mdb-ink);background:#EEF3F9;padding:10px 12px;border-left:3px solid var(--mdb-cyan)}
.typehelp{margin:0;padding-left:1.1em;font-size:12px;font-weight:400;color:var(--mdb-muted);line-height:1.6}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;background:#fff;box-shadow:var(--shadow-chip)}
.zoombar button{width:36px;height:36px;border:0;background:none;color:var(--mdb-navy)}
.hint{position:absolute;right:16px;top:16px;left:16px;text-align:right;font-size:12px;line-height:1.6;color:var(--mdb-muted);pointer-events:none}
.rside{border-left:1px solid var(--mdb-rule);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--mdb-rule)}
.tabs button{height:44px;border:0;font-size:14px;font-weight:700}
.rbody{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.label-cyan{font-size:12px;color:var(--mdb-cyan);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:#fff;width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-card)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.125em;flex:none}
.only-wide{display:inline}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto}
  .hdr{flex-wrap:wrap;padding:10px 16px;min-height:56px}
  .hdr-l,.hdr-r{width:100%;flex-wrap:wrap}
  .hdr-r{gap:8px}
  .scroll-ice{overflow:visible}
  .page{padding:32px 16px 48px}
  .builder{grid-template-columns:1fr}
  .lside{border-right:0;border-bottom:1px solid var(--mdb-rule);overflow:visible}
  .canvas{height:62vh;min-height:360px}
  .rside{border-left:0;border-top:1px solid var(--mdb-rule)}
  .rbody{overflow:visible}
  .only-wide{display:none}
}
</style>
</head>

    while (q.length) { const id = q.shift(); out.push(id); adj[id].forEach(t => { if (--indeg[t] === 0) q.push(t); }); q = sort(q); }
    f.nodes.forEach(n => { if (!out.includes(n.id)) out.push(n.id); });
    return out;
  }
  startRun() {
    const f = this.flow(); if (!f || !f.nodes.length) return;
    clearTimeout(this.timer);
    this.setState({ tab: 'log', run: { agentId: this.state.agentId, flowKey: this.state.flowKey, order: this.topo(f), i: 0, status: 'running', ns: {}, log: [{ time: now(), node: 'システム', icon: 'play', color: '#12439B', text: '「' + f.name + '」の試験実行を開始しました。' }] } }, () => this.step());
  }
  stopRun() {
    clearTimeout(this.timer);
    this.setState(s => s.run ? { run: { ...s.run, status: 'stopped', log: [...s.run.log, { time: now(), node: 'システム', icon: 'stop', color: '#C70909', text: '実行を停止しました。' }] } } : null);
  }
  runNode(id) { const r = this.state.run, a = r && this.state.store.agents.find(x => x.id === r.agentId), f = a && a.flows[r.flowKey]; return f ? f.nodes.find(n => n.id === id) : null; }
  step() {
    const r = this.state.run; if (!r || r.status !== 'running') return;
    if (r.i >= r.order.length) { this.setState({ run: { ...r, status: 'done', log: [...r.log, { time: now(), node: 'システム', icon: 'flag-checkered', color: '#12439B', text: 'すべてのノードが完了しました。' }] } }); return; }
    const id = r.order[r.i], n = this.runNode(id);
    if (!n) { this.setState({ run: { ...r, i: r.i + 1 } }, () => this.step()); return; }
    this.setState({ run: { ...r, ns: { ...r.ns, [id]: 'running' } } });
    this.timer = setTimeout(() => {
      const r2 = this.state.run; if (!r2 || r2.status !== 'running') return;
      const t = TYPES[n.type] || TYPES.ai;
      if (n.type === 'human' && r2.i > 0) {
        const choices = (n.choices || '承認').split(/[、,]/).map(s => s.trim()).filter(Boolean);
        this.setState({ run: { ...r2, status: 'waiting', ns: { ...r2.ns, [id]: 'waiting' }, log: [...r2.log, { time: now(), node: n.title, icon: t.icon, color: t.color, text: (n.desc || '判断してください') + '。本人の判断を待っています。', choices }] } });
      } else {
        this.setState({ run: { ...r2, i: r2.i + 1, ns: { ...r2.ns, [id]: 'done' }, log: [...r2.log, { time: now(), node: n.title, icon: t.icon, color: t.color, text: n.output || t.output }] } }, () => this.step());
      }
    }, RUN_SPEED);
  }
  choose(label) {
    const r = this.state.run; if (!r || r.status !== 'waiting') return;
    const id = r.order[r.i];
    const log = r.log.map((e, i) => i === r.log.length - 1 ? { ...e, choices: null } : e);
    this.setState({ run: { ...r, status: 'running', i: r.i + 1, ns: { ...r.ns, [id]: 'done' }, log: [...log, { time: now(), node: '本人の判断', icon: 'check', color: '#B08E02', text: '「' + label + '」を選択しました。' }] } }, () => this.step());
  }

  compilePrompt(scope) {
    const a = this.agent(); if (!a) return '';
    const L = [];
    L.push('# ' + a.name, '', '## 役割', 'あなたは「' + a.name + '」です。' + (a.purpose || ''));
    const donts = (a.donts || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (a.saves || donts.length) { L.push('', '## ルール'); if (a.saves) L.push('- 次の内容を保存してください：' + a.saves); donts.forEach(d => L.push('- ' + d + 'は実行しないでください。')); }
    const keys = scope === 'all' ? a.order : [this.state.flowKey];
    keys.filter(k => a.flows[k]).forEach(k => {
      const f = a.flows[k], ids = this.topo(f), by = Object.fromEntries(f.nodes.map(n => [n.id, n]));
      const lv = levelsOf(f.nodes, f.edges), byLv = {};
      f.nodes.forEach(n => { (byLv[lv[n.id]] = byLv[lv[n.id]] || []).push(n.id); });
      const hasPar = Object.values(byLv).some(v => v.length > 1);
      L.push('', '## フロー：' + f.name + '（' + f.status + '）');
      if (f.note) L.push(f.note);
      L.push('', hasPar ? '次の手順を番号順に実行してください。「並行して進めてかまいません」とある手順は、同時に進めてかまいません。' : '次の手順を上から順に実行してください。');
      ids.forEach((id, i) => {
        const n = by[id]; if (!n) return;
        const t = TYPES[n.type] || TYPES.ai;
        L.push('', `${i + 1}. 【${t.label}】${n.title}`);
        if (n.desc) L.push('   - 内容：' + n.desc);
        if (n.tool) L.push('   - 使用ツール：' + n.tool);
        if (n.type === 'human' && i > 0) { const ch = (n.choices || '').split(/[、,]/).map(s => s.trim()).filter(Boolean); L.push('   - ここで作業を止め、本人に判断を求めてください。' + (ch.length ? '選択肢：' + ch.join('／') : '')); }
        else if (n.type === 'human') L.push('   - 本人からの依頼・入力を受け取って開始します。');
        else if (n.type === 'program') L.push('   - この手順はプログラムが自動で行います。');
        if (n.output) L.push('   - 出力の例：' + n.output);
        const next = f.edges.filter(e => e.from === id).map(e => by[e.to] && by[e.to].title).filter(Boolean);
        if (next.length > 1) L.push('   - 次の手順：' + next.join('、'));
        const prev = f.edges.filter(e => e.to === id).map(e => by[e.from] && by[e.from].title).filter(Boolean);
        if (prev.length > 1) L.push('   - 「' + prev.join('」「') + '」がすべて終わってから進めてください。');
        const mates = (byLv[lv[id]] || []).filter(x => x !== id).map(x => by[x] && by[x].title).filter(Boolean);
        if (mates.length) L.push('   - 「' + mates.join('」「') + '」と並行して進めてかまいません。');
      });
    });
    return L.join('\n');
  }
  openExport() { this.setState({ exportInfo: '', exportOpen: true, exportScope: 'flow', exportText: this.compilePrompt('flow'), exportCopied: false, exportApplied: false, exportNote: '' }); }
  async refineExport() {

  renderBuilder({ agent, f, hasFlow, runHere, ns, active }) {
    const { sel, pan, zoom, tab, temp, confirm, flowKey } = this.state;
    const selNode = sel && sel.kind === 'node' ? f.nodes.find(n => n.id === sel.id) : null;
    const selEdge = sel && sel.kind === 'edge' ? f.edges.find(e => e.id === sel.id) : null;
    const selAgent = sel && sel.kind === 'agent';
    const setN = k => e => selNode && this.updNode(selNode.id, { [k]: e.target.value });
    const setF = k => e => { const v = e.target.value; this.updFlow(() => ({ [k]: v })); };
    const setA = k => e => { const v = e.target.value; this.updAgent(() => ({ [k]: v })); };
    const byId = Object.fromEntries(f.nodes.map(n => [n.id, n]));
    const gs = 24 * zoom;
    const dontList = (agent.donts || '').split('\n').map(x => x.trim()).filter(Boolean);
    const flowC = confirm && confirm.kind === 'flow' && confirm.key === flowKey;

    /* edges */
    const paths = [], used = {};
    f.edges.forEach(e => {
      const a = byId[e.from], b = byId[e.to]; if (!a || !b) return;
      const [s1, s2] = edgeSides(e, a, b);
      used[a.id + s1] = 1; used[b.id + s2] = 1;
      const d = edgePath(portPos(a, s1), s1, portPos(b, s2), s2);
      const isSel = sel && sel.kind === 'edge' && sel.id === e.id, lit = ns[e.from] === 'done' && ns[e.to];

        <div style=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, padding: '18px 24px', borderBottom: '1px solid #ccc' }}>
          <div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}><div class="label-cyan">プロンプトを出力</div><div style=${{ fontSize: 18, fontWeight: 700 }}>${agent.name}</div></div>
          <button class="h5" title="閉じる" aria-label="閉じる" onClick=${close} style=${{ width: 36, height: 36, border: 0, background: 'none', color: '#666', fontSize: 18 }}><${Icon} name="times"/></button>
        </div>
        <div style=${{ padding: '16px 24px', display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', borderBottom: '1px solid #eee' }}>
          <span style=${{ fontSize: 13, fontWeight: 700 }}>対象</span>
          <div style=${{ display: 'flex', border: '1px solid #12439B' }}>
            <button style=${seg(!all)} onClick=${() => this.setState({ exportScope: 'flow', exportText: this.compilePrompt('flow'), exportCopied: false })}>表示中のフロー</button>
            <button style=${seg(all)} onClick=${() => this.setState({ exportScope: 'all', exportText: this.compilePrompt('all'), exportCopied: false })}>すべてのフロー</button>
          </div>
          <div style=${{ flex: 1 }}></div>
          ${s.ai && !s.exportRefining && html`<button class="link h5" onClick=${() => this.refineExport()}><${Icon} name="magic" style=${{ marginRight: 6 }}/>Claudeで文章を整える</button>`}
          ${!s.exportRefining && html`<button class="link h5" onClick=${() => copyText(REFINE + '\n\n---\n' + s.exportText, () => this.setState({ exportInfo: 'ChatGPTで整える依頼文をコピーしました。ChatGPTに貼って送り、返ってきた文章をこの欄に貼り替えてください。' }))}><${Icon} name="copy" style=${{ marginRight: 6 }}/>ChatGPTで整える</button>`}
          ${s.exportRefining && html`<span style=${{ color: '#00A5E5', fontSize: 13, display: 'inline-flex', alignItems: 'center', gap: 6 }}><${Icon} name="spinner" spin=${true}/>整えています…</span>`}
          <button class="link h5" onClick=${() => this.setState(st => ({ exportText: this.compilePrompt(st.exportScope), exportCopied: false }))}><${Icon} name="redo" style=${{ marginRight: 6 }}/>フローから再生成</button>
        </div>
        <div style=${{ padding: '16px 24px', flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <textarea id="export-text" aria-label="出力するプロンプト" value=${s.exportText} onChange=${e => this.setState({ exportText: e.target.value, exportCopied: false })} style=${{ flex: 1, minHeight: 120, height: 340, padding: 14, border: '1px solid #ccc', fontSize: 13, lineHeight: 1.75, resize: 'vertical' }}></textarea>
          <div style=${{ fontSize: 12, color: '#666' }}>※出力後に直接編集できます。${s.exportText.length}文字</div>
          ${s.exportInfo && html`<div style=${{ fontSize: 12, color: '#00A5E5' }}>${s.exportInfo} <a href=${CHATGPT_URL} target="_blank" rel="noopener">ChatGPTを開く ↗</a></div>`}
          ${s.exportNote && html`<div style=${{ fontSize: 12, color: '#C70909' }}>${s.exportNote}</div>`}
        </div>
        <div style=${{ display: 'flex', gap: 12, alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', padding: '16px 24px', borderTop: '1px solid #eee' }}>
          <button class="link h5" onClick=${() => { const t = s.exportText; this.updAgent(() => ({ prompt: t })); this.setState({ exportApplied: true }); }}>${applied ? 'AI社員のプロンプトに保存しました' : 'この内容をAI社員のプロンプトとして保存'}</button>
          <div style=${{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <button class="pill pill-o h6" style=${{ padding: '9px 22px', fontSize: 14 }} title="すべてのフローを、設計したChatGPTの会話に戻して構築を続けます" onClick=${() => copyText(BUILD_HEAD + this.compilePrompt('all'), () => this.setState({ exportInfo: '「構築へ」から始まる文をコピーしました（すべてのフロー）。AI社員ビルダーで設計したChatGPTの会話に貼って送ると、このフローのまま構築に進みます。' }))}><${Icon} name="play"/>ChatGPTで構築を続ける</button>
            <button class="pill pill-o h6" style=${{ padding: '9px 22px', fontSize: 14 }} onClick=${() => this.downloadExport()}><${Icon} name="file-download"/>ダウンロード</button>
            <button class="pill pill-p h6" style=${{ padding: '10px 26px', fontSize: 14 }} onClick=${() => this.copyExport()}><${Icon} name="copy"/>${s.exportCopied ? 'コピーしました' : 'コピー'}</button>
          </div>
        </div>
      </div>
    </div>`;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>

</body>
</html>
